# Manual pipeline to provision the AzCopy telemetry Application Insights backend.
#
# This is infrastructure lifecycle, NOT build/test/release, so it is deliberately
# kept out of azure-pipelines.yml (CI) and build-1es-pipeline.yaml (release).
# Run it on demand to create or update the Test / Prod App Insights instances.
#
# Prerequisites (one-time):
#   - A workload-identity-federated ADO service connection (see serviceConnection
#     parameter below) with Contributor on the target subscription / resource group.
#     Role Based Access Control Administrator is also required when this pipeline
#     creates the optional E2E query role assignments.
#   - The target subscription id.

trigger: none
pr: none

parameters:
  - name: environmentName
    displayName: 'Environment to provision'
    type: string
    default: 'test'
    values:
      - test
      - prod

  - name: serviceConnection
    displayName: 'ADO service connection (workload identity) with Contributor on the target subscription'
    type: string
    default: 'azcopy-telemetry-infra'

  - name: subscriptionId
    displayName: 'Target subscription id'
    type: string

  - name: resourceGroupName
    displayName: 'Resource group name (created if it does not exist)'
    type: string
    default: 'azcopy-telemetry-rg'

  - name: location
    displayName: 'Azure region'
    type: string
    default: 'eastus'

  - name: e2eQueryPrincipalId
    displayName: 'Optional object ID of the E2E workload identity to grant read/query access'
    type: string
    default: ''

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: AzureCLI@2
    displayName: 'Provision App Insights (${{ parameters.environmentName }})'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        az extension add --name log-analytics --yes
        az account set --subscription "${{ parameters.subscriptionId }}"

        echo "Ensuring resource group '${{ parameters.resourceGroupName }}' exists in ${{ parameters.location }}"
        az group create \
          --name "${{ parameters.resourceGroupName }}" \
          --location "${{ parameters.location }}" \
          --tags service=azcopy-telemetry managedBy=bicep

        template_file="$(System.DefaultWorkingDirectory)/infra/telemetry/main.bicep"
        parameters_file="$(System.DefaultWorkingDirectory)/infra/telemetry/${{ parameters.environmentName }}.bicepparam"
        query_principal="${{ parameters.e2eQueryPrincipalId }}"

        echo "Compiling telemetry Bicep"
        az bicep build --file "$template_file" --stdout >/dev/null

        echo "Validating telemetry deployment"
        az deployment group validate \
          --resource-group "${{ parameters.resourceGroupName }}" \
          --template-file "$template_file" \
          --parameters "$parameters_file" \
          e2eQueryPrincipalId="$query_principal" \
          --output none

        echo "Previewing telemetry deployment changes"
        az deployment group what-if \
          --resource-group "${{ parameters.resourceGroupName }}" \
          --template-file "$template_file" \
          --parameters "$parameters_file" \
          e2eQueryPrincipalId="$query_principal"

        echo "Deploying telemetry backend (environment=${{ parameters.environmentName }})"
        az deployment group create \
          --resource-group "${{ parameters.resourceGroupName }}" \
          --name "azcopy-telemetry-${{ parameters.environmentName }}" \
          --template-file "$template_file" \
          --parameters "$parameters_file" \
          e2eQueryPrincipalId="$query_principal" \
          --output none

        workspace_customer_id=$(az deployment group show \
          --resource-group "${{ parameters.resourceGroupName }}" \
          --name "azcopy-telemetry-${{ parameters.environmentName }}" \
          --query properties.outputs.workspaceCustomerId.value -o tsv)

        echo "Running Log Analytics smoke query"
        az monitor log-analytics query \
          --workspace "$workspace_customer_id" \
          --analytics-query 'print SmokeTest=1' \
          --output none

        echo "Provisioned and verified telemetry backend."
